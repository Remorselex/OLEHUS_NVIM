git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers
  # no network on open; noticeably faster startup
  autoFetch: false
  log:
    # the commit graph is expensive on a long history; "+" (maximise) turns it on
    showGraph: when-maximised

refresher:
  # lazygit polls with `git status --untracked-files=all`, which has to walk the
  # whole working tree. On a 436k-file repository that is ~10 s per poll, so at
  # the default 10 s interval the command is essentially always running and eats
  # half a core. Nothing in lazygit turns -uall off, so the lever is frequency.
  # The live edit->review loop lives in Neogit anyway; here `R` refreshes on demand.
  refreshInterval: 120
  fetchInterval: 3600

os:
  # hand the file to the running nvim over its socket instead of nesting an editor
  edit: 'nvim --server /tmp/nvim.sock --remote-tab {{filename}}'
  editAtLine: 'nvim --server /tmp/nvim.sock --remote-tab +{{line}} {{filename}}'
  editAtLineAndWait: 'nvim --server /tmp/nvim.sock --remote-tab-wait +{{line}} {{filename}}'
